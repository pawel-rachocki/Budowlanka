# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/budowlanka
spring.datasource.username=${DB_USERNAME:budowlanka}
spring.datasource.password=${DB_PASSWORD:budowlanka}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Mail (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# App
app.base-url=http://localhost:8080

# Cookie set to false only for non-localhost HTTP dev environments
app.cookie-secure=true

# S3 / Storage
app.s3.endpoint=
app.s3.region=${S3_REGION:us-east-1}
app.s3.bucket=${S3_BUCKET:crew-photos}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}
app.s3.force-path-style=false
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
# ^ Empty = not configured; callers must check StringUtils.hasText() before use