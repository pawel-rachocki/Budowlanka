# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/budowlanka
spring.datasource.username=${DB_USERNAME:budowlanka}
spring.datasource.password=${DB_PASSWORD:budowlanka}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Mail (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# App
app.base-url=http://localhost:8080

# CORS — comma-separated lista dozwolonych originów frontendu (bind do List<String>).
# Prod: ustaw CORS_ALLOWED_ORIGINS=https://<domena-prod>,https://www.<domena-prod>
# (domena jeszcze nie wykupiona — profil prod wymaga env, patrz application-prod.properties)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Scheduling
# Cron wygaszania subskrypcji + ukrywania profili (domyślnie co godzinę). Strefa: Europe/Warsaw.
app.scheduling.subscription-expiry-cron=${SUBSCRIPTION_EXPIRY_CRON:0 0 * * * *}

# Cookie set to false only for non-localhost HTTP dev environments
app.cookie-secure=true

# Moderation (SightEngine)
app.moderation.enabled=false
app.moderation.api-user=
app.moderation.api-secret=
app.moderation.base-url=https://api.sightengine.com

# S3 / Storage
app.s3.endpoint=
app.s3.region=${S3_REGION:us-east-1}
app.s3.bucket=${S3_BUCKET:crew-photos}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}
app.s3.force-path-style=false
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
# ^ Empty = not configured; callers must check StringUtils.hasText() before use

# Rate limiting (Bucket4j) — per-IP, in-memory (wystarczy dla 1 VPS; Redis backend przy skali).
# UWAGA: za reverse proxy (nginx) getRemoteAddr() zwróci IP proxy — wtedy ustawić
# server.forward-headers-strategy=framework i przekazywać X-Forwarded-For z nginx.
app.rate-limit.enabled=true
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-period=1m
app.rate-limit.register.capacity=3
app.rate-limit.register.refill-period=1m
app.rate-limit.reviews.capacity=10
app.rate-limit.reviews.refill-period=1m
app.rate-limit.profiles-list.capacity=60
app.rate-limit.profiles-list.refill-period=1m

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Payments (Przelewy24)
# enabled=false tryb mock (lokalny dev bez realnych kluczy P24)
app.payments.enabled=${P24_ENABLED:false}
app.payments.merchant-id=${P24_MERCHANT_ID:}
app.payments.pos-id=${P24_POS_ID:}
# crc wylacznie do podpisania SHA384; apiKey do Basic Auth. Sekrety NIGDY w repo.
app.payments.crc=${P24_CRC:}
app.payments.api-key=${P24_API_KEY:}
app.payments.base-url=${P24_BASE_URL:https://sandbox.przelewy24.pl}
app.payments.url-return=${P24_URL_RETURN:http://localhost:5173/platnosc/sukces}
app.payments.url-status=${P24_URL_STATUS:http://localhost:8080/api/payments/webhook/p24}