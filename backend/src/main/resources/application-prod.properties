# Profil prod — uruchamiaj z SPRING_PROFILES_ACTIVE=prod.
# Zasada: zero developerskich defaultów. Brak wymaganego env = aplikacja nie wstartuje (fail-fast).

# CORS — jawna lista originów frontendu, bez defaultu localhost.
# Po wykupieniu domeny: CORS_ALLOWED_ORIGINS=https://<domena>,https://www.<domena>
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cookies refresh tokena tylko po HTTPS
app.cookie-secure=true
