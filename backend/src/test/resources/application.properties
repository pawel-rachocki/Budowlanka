# Datasource — Testcontainers (izolowany, efemeryczny PostgreSQL; NIE dev-baza).
# Sterownik tc:// startuje kontener postgres:17, Flyway nakłada migracje na czysty schema.
spring.datasource.url=jdbc:tc:postgresql:17:///budowlanka
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Mail — safe test values (no real SMTP connection in unit tests)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=test-user
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT — safe test values satisfying @Size(min=32)
app.jwt.secret=test-secret-key-at-least-32-chars!!
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# App
app.base-url=http://localhost:8080
app.cookie-secure=false

# CORS — origin devowego frontendu; RateLimitIntegrationTest polega na nim przy asercjach 429+CORS
app.cors.allowed-origins=http://localhost:5173

# Scheduling — wyłączone w testach ("-" = Spring CRON_DISABLED); testy wołają serwis bezpośrednio
app.scheduling.subscription-expiry-cron=-

# Rate limiting — wyłączone globalnie w testach (bucket'y żyją z kontekstem Springa
# współdzielonym między klasami -> flaky 429 przy wielu loginach/rejestracjach z 127.0.0.1).
# Dedykowany RateLimitIntegrationTest włącza przez @TestPropertySource.
app.rate-limit.enabled=false
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-period=1m
app.rate-limit.register.capacity=3
app.rate-limit.register.refill-period=1m
app.rate-limit.reviews.capacity=10
app.rate-limit.reviews.refill-period=1m
app.rate-limit.profiles-list.capacity=60
app.rate-limit.profiles-list.refill-period=1m

# S3 — dummy values for tests (S3Client is mocked via @MockitoBean)
app.s3.endpoint=http://localhost:9000
app.s3.region=us-east-1
app.s3.bucket=crew-photos
app.s3.access-key=test-access-key
app.s3.secret-key=test-secret-key
app.s3.force-path-style=true
app.s3.public-base-url=http://localhost:9000/crew-photos
