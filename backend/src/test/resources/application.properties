# Datasource (same as main — integration tests use real local DB)
spring.datasource.url=jdbc:postgresql://localhost:5432/budowlanka
spring.datasource.username=${DB_USERNAME:budowlanka}
spring.datasource.password=${DB_PASSWORD:budowlanka}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Mail — safe test values (no real SMTP connection in unit tests)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=test-user
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT — safe test values satisfying @Size(min=32)
app.jwt.secret=test-secret-key-at-least-32-chars!!
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# App
app.base-url=http://localhost:8080
