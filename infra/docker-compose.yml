services:
  db:
    image: postgres:17
    container_name: budowlanka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: budowlanka
      POSTGRES_USER: budowlanka
      POSTGRES_PASSWORD: budowlanka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budowlanka -d budowlanka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio
    container_name: budowlanka_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: budowlanka_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/crew-photos &&
      mc anonymous set public local/crew-photos &&
      echo 'MinIO bucket crew-photos ready (public read)'
      "

volumes:
  pgdata:
  miniodata:
