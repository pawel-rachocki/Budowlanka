services:
  db:
    image: postgres:17
    container_name: budowlanka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: budowlanka
      POSTGRES_USER: budowlanka
      POSTGRES_PASSWORD: budowlanka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budowlanka -d budowlanka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio
    container_name: budowlanka_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
